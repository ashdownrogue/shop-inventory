<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14181b">
<title>Shop Inventory</title>
<meta name="description" content="Garage shop inventory audit. Mark what you have, get a triaged buy list.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="plate" id="plate">
  <div class="plate-row">
    <a class="plate-id" href="#/">
      <span class="plate-id-main">SHOP INVENTORY</span>
      <span class="plate-id-sub">AUDIT / LARAMIE WY</span>
    </a>
    <div class="plate-tally" id="plateTally">
      <span class="tally-num" id="tallyDone">0</span><span class="tally-sep">/</span><span class="tally-tot" id="tallyTotal">0</span>
      <span class="tally-label">audited</span>
    </div>
  </div>
  <div class="gauge" id="plateGauge" aria-hidden="true"></div>
</header>

<main id="view" tabindex="-1"></main>

<nav class="dock" id="dock">
  <a href="#/" data-nav="index" class="dock-btn">
    <span class="dock-glyph">☰</span><span class="dock-label">Index</span>
  </a>
  <a href="#/buy" data-nav="buy" class="dock-btn">
    <span class="dock-glyph">$</span><span class="dock-label">Buy list</span>
    <span class="dock-badge" id="buyBadge" hidden>0</span>
  </a>
  <a href="#/settings" data-nav="settings" class="dock-btn">
    <span class="dock-glyph">⚙</span><span class="dock-label">Data</span>
  </a>
</nav>

<div class="toast" id="toast" hidden>
  <span id="toastMsg"></span>
  <button type="button" id="toastUndo" class="toast-undo">Undo</button>
</div>

<div class="boot" id="boot">Loading checklist…</div>

<script src="app.js"></script>
</body>
</html>
